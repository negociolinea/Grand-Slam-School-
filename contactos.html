    <style>
body {
  /* Fondo azul degradado */
  background: linear-gradient(135deg, #0a192f, #167a0b);

  
  font-family: 'Segoe UI', sans-serif;
  color: #fff;
  margin: 0;
  padding: 0;
}
/* Menú principal */
nav {
  background-color: #0a192f; /* azul profundo */
  display: flex;
  justify-content: center;
  padding: 20px;
  box-shadow: 0 4px 8px rgba(0,0,0,0.4);
}

/* Elementos del menú */
nav a {
  color: #f1f1f1;
  text-decoration: none;
  margin: 0 25px;
  font-size: 18px;
  font-weight: 600;
  position: relative;
  transition: color 0.3s ease, border-bottom 0.3s ease;
}

/* Hover con dorado tipo trofeo */
nav a:hover {
  color: #ffd700;
  border-bottom: 2px solid #ffd700;
}

/* Botones estilo pelota de tenis corporativa */
.button-tenis {
  background-color: #ffd700; /* dorado */
  color: #0d1b2a;
  border: none;
  border-radius: 30px;
  padding: 12px 25px;
  font-weight: bold;
  cursor: pointer;
  transition: transform 0.2s ease, background-color 0.3s ease;
}

.button-tenis:hover {
  background-color: #e6c200;
  transform: scale(1.05);
}

/* Títulos con tipografía elegante y deportiva */
h1, h2, h3 {
  font-family: 'Montserrat', sans-serif;
  text-transform: uppercase;
  letter-spacing: 2px;
  color: #ffd700;
  text-shadow: 1px 1px #000;
}
main {
  padding: 40px 70px;
}
/* Tarjetas: fondo, sombras y transición */
				.card{background:var(--card); border-radius:12px; box-shadow:0 9px 30¿px rgba(36,36,36,0.06); padding:22px; min-height:120px; transition:transform .18s ease, box-shadow .18s ease}

				/* Encabezado dentro de la tarjeta: color de acento */
				.card h3{margin-top:0; color:#ffd700;}

				/* Texto dentro de la tarjeta: color y interlineado */
				.card p{color:var(--muted); line-height:1.5}

				/* Hover en tarjeta: elevar y aumentar sombra */
				.card:hover{transform:translateY(-6px); box-shadow:0 18px 50px rgba(36,36,36,0.08)}

				/* Pie de página: espaciado y centrado */
				footer{background:transparent; padding:28px 20px; text-align:center}

				/* Iconos sociales: tamaño, filtro y transición */
				.socials img{width:40px; height:40px; margin:0 8px; filter:grayscale(40%); transition:filter .15s ease, transform .15s ease}

				/* Hover en iconos sociales: color y elevación */
				.socials img:hover{filter:none; transform:translateY(-3px)}

				/* Texto legal en el footer: tamaño y color */
				.legal{margin-top:12px; font-size:13px; color:#8a8a8a}

				/* Media query para pantallas grandes: ajustar padding y tamaño de marca */
				@media(min-width:900px){ .hero{padding:96px 40px} .brand{font-size:24px} }
/* Imagen izquierda */
.menu-icon {
  position: absolute;
  left: 10px;   /* coordenada desde el borde izquierdo */
  top: 3%;     /* centrada verticalmente */
  transform: translateY(-50%); /* ajuste exacto al centro */
    transform: translateY(-5%);

  width: 50px;
  height: 50px;
}

/* Imagen derecha */
.menu-icon2 {
  position: absolute;
  right: 10px;  /* coordenada desde el borde derecho */
  top: 3%;
  transform: translateY(-50%);
  transform: translateY(-5%);
  width: 50px;
  height: 50px;
}
nav a {
  color: #f1f1f1;
  text-decoration: none;
  margin: 0 25px;
  font-size: 20px; /* letras más grandes */
  font-weight: 600;
  position: relative;
  transition: color 0.3s ease;
}

/* Hover con pelota de tenis */
nav a:hover {
  color: #ffd700;
}

nav a:hover::after {
  content: "🎾"; /* pelota de tenis emoji */
  position: absolute;
  right: -40px; /* espacio a la derecha */
  font-size: 22px;
}
.social-links {
  display: flex;
  justify-content: center;
  gap: 25px;
  margin-top: 20px;
}

.social-links a {
  text-decoration: none;
  font-size: 18px;
  font-weight: bold;
  padding: 12px 20px;
  border-radius: 30px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: transform 0.3s ease, box-shadow 0.3s ease;
}

/* Colores personalizados */
.facebook {
  background: #0d1b2a;
  color: #ffd700;
  border: 2px solid #ffd700;
}
.instagram {
  background: #0d1b2a;
  color: #ffd700;
  border: 2px solid #ffd700;
}
.whatsapp {
  background: #0d1b2a;
  color: #ffd700;
  border: 2px solid #ffd700;
}

/* Hover elegante */
.social-links a:hover {
  transform: scale(1.05);
  box-shadow: 0 0 15px rgba(255, 215, 0, 0.6);
  background: #ffd700;
  color: #0d1b2a;
}

.b {
  font-family: 'Montserrat', sans-serif;
  letter-spacing: 2px;
  color: #ffffff;
  text-shadow: 1px 1px #000;
}
/* Imágenes fluidas en toda la página */
img {
  max-width: 100%;
  height: auto;
}

/* Contenedor principal */
main, section {
  padding: 40px 20px;
}

/* Ajustes generales para pantallas medianas */
@media (max-width: 992px) {
  nav {
    flex-wrap: wrap;
    justify-content: center;
  }

  nav a {
    margin: 10px;
    font-size: 16px;
  }

  h1, h2, h3 {
    font-size: 24px;
    letter-spacing: 1px;
  }

  main, section {
    padding: 20px;
  }
}

/* Ajustes para pantallas pequeñas (móviles) */
@media (max-width: 600px) {
  nav {
    flex-direction: column;
    align-items: center;
  }

  nav a {
    margin: 8px 0;
    font-size: 14px;
  }

  .social-links {
    flex-direction: column;
    gap: 15px;
  }

  .social-links a {
    width: 100%;
    justify-content: center;
  }

  h1, h2, h3 {
    font-size: 20px;
  }

  p, li {
    font-size: 14px;
    line-height: 1.4;
  }
}
